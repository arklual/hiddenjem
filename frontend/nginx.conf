# =============================================================================
#  Horizon frontend — конфигурация nginx (шаблон)
# =============================================================================
#  Файл монтируется в образ как /etc/nginx/nginx.conf.template; docker-entrypoint.sh
#  подставляет переменные окружения и кладёт результат в /tmp/nginx/nginx.conf.
#
#  Подставляются ТОЛЬКО эти переменные (остальные $... — переменные nginx):
#     ${NGINX_PORT} ${NGINX_RESOLVER} ${HORIZON_GATEWAY_URL} ${HORIZON_API_TIMEOUT}
#     ${HORIZON_SSE_TIMEOUT} ${HORIZON_CSP_CONNECT_SRC} ${HORIZON_HSTS_DIRECTIVE}
#
#  Требования, которые здесь реализованы:
#     NFR-S5  — OWASP-заголовки безопасности
#     NFR-S9  — работа под non-root с read-only корневой ФС
#     NFR-U2  — проксирование SSE без буферизации (прогресс саги в реальном времени)
#     NFR-O3  — структурированный (JSON) access-log с traceparent
# =============================================================================

worker_processes auto;
# Ошибки — в stderr контейнера; файловый лог при read-only rootfs невозможен и не нужен.
error_log  /dev/stderr warn;
# Мастер-процесс работает под uid 10001, поэтому pid-файл только в tmpfs.
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Пути для временных файлов: корень read-only, всё пишем в tmpfs ───
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    # ─── Не раскрываем версию и сам факт использования nginx (NFR-S5) ───
    server_tokens off;

    # ─── Логи: JSON, коррелируются с трейсами по traceparent (NFR-O3) ───
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_s":$request_time,'
        '"upstream_duration_s":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"traceparent":"$http_traceparent",'
        '"request_id":"$request_id"'
      '}';
    access_log /dev/stdout json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    absolute_redirect off;
    port_in_redirect  off;

    # ─── Ограничения запроса: статика не принимает больших тел ───
    client_max_body_size   2m;
    client_body_timeout    15s;
    client_header_timeout  15s;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    # ─── Сжатие ───
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/problem+json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;
    # Изображения и уже сжатые форматы повторно жать бессмысленно —
    # это только тратит CPU.

    # ─── Апстрим шлюза ───
    # Резолвер и переменная нужны, чтобы nginx не падал при старте, если
    # gateway ещё не поднялся: адрес резолвится в момент запроса, а не конфигурации.
    # Адрес DNS задаётся снаружи: 127.0.0.11 — встроенный резолвер Docker,
    # в Kubernetes сюда подставляется ClusterIP kube-dns (values: frontend.nginxResolver).
    # Директива resolver принимает только IP-адреса, имя здесь работать не будет.
    resolver ${NGINX_RESOLVER} ipv6=off valid=30s;
    map $host $horizon_gateway {
        default "${HORIZON_GATEWAY_URL}";
    }

    # ─── Прокидываем traceparent насквозь; если его нет — генерируем request_id ───
    map $http_traceparent $horizon_trace {
        default $http_traceparent;
        ""      "";
    }

    server {
        listen      ${NGINX_PORT};
        listen      [::]:${NGINX_PORT};
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;
        charset     utf-8;

        # ─────────── Заголовки безопасности (NFR-S5, OWASP) ───────────
        # Применяются ко ВСЕМ ответам, включая 4xx/5xx (`always`).
        # CSP рассчитан на сборку Vite: скрипты только свои, инлайн-скриптов нет.
        # 'unsafe-inline' в style-src оставлен осознанно: React выставляет
        # инлайновые стили; убрать — только вместе с переходом на nonce.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src ${HORIZON_CSP_CONNECT_SRC}; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header X-Frame-Options           "DENY"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;
        add_header X-Permitted-Cross-Domain-Policies "none"     always;
        # HSTS выдаётся только там, где есть TLS. Подставляется ЦЕЛИКОМ директива
        # (или пустая строка): add_header с пустым значением повёл бы себя неочевидно.
        # prod: HORIZON_HSTS_DIRECTIVE='add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;'
        ${HORIZON_HSTS_DIRECTIVE}

        # ─────────── Проба живости для оркестратора ───────────
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # ─────────── Трассировка термина: повтор анализа, 35–85 с ───────────
        # Выше общего /api/: его 60 с обрывали ответ, который шлюз и trends-service ждут дольше
        # (320 и 300 с). Таймаут здесь — последний в цепочке и потому самый длинный.
        location ~ ^/api/v1/reports/[^/]+/explain$ {
            proxy_pass              $horizon_gateway;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $remote_addr;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_set_header        X-Request-Id      $request_id;
            proxy_connect_timeout   5s;
            proxy_send_timeout      330s;
            proxy_read_timeout      330s;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # ─────────── SSE: прогресс саги (ADR-0012) ───────────
        # Должно стоять ВЫШЕ общего /api/, иначе буферизация убьёт поток.
        location ~ ^/api/v1/research-requests/[^/]+/events$ {
            proxy_pass              $horizon_gateway;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            # Overwrite, never append. $proxy_add_x_forwarded_for preserves a client-supplied
            # value as the left-most entry, and every consumer downstream reads the left-most
            # entry — so a client could choose its own identity for rate limiting and author the
            # `ip` column of the append-only audit log. This is the only trusted hop, so it is the
            # only place allowed to state the origin address.
            proxy_set_header        X-Forwarded-For   $remote_addr;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Request-Id      $request_id;
            # Ключевое для SSE: без этих трёх строк события копятся в буфере
            # и приходят пачкой в конце, а не по мере готовности.
            proxy_buffering         off;
            proxy_cache             off;
            chunked_transfer_encoding off;
            # Поток живёт всё время анализа (NFR-P2: p95 <= 90 c, потолок — таймаут саги).
            proxy_read_timeout      ${HORIZON_SSE_TIMEOUT};
            proxy_send_timeout      ${HORIZON_SSE_TIMEOUT};
        }

        # ─────────── Остальной API → шлюз ───────────
        location /api/ {
            proxy_pass              $horizon_gateway;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            # Overwrite, never append. $proxy_add_x_forwarded_for preserves a client-supplied
            # value as the left-most entry, and every consumer downstream reads the left-most
            # entry — so a client could choose its own identity for rate limiting and author the
            # `ip` column of the append-only audit log. This is the only trusted hop, so it is the
            # only place allowed to state the origin address.
            proxy_set_header        X-Forwarded-For   $remote_addr;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_set_header        X-Request-Id      $request_id;
            proxy_connect_timeout   5s;
            proxy_send_timeout      ${HORIZON_API_TIMEOUT};
            proxy_read_timeout      ${HORIZON_API_TIMEOUT};
            proxy_buffering         on;
            proxy_buffers           8 16k;
            proxy_busy_buffers_size 32k;
            # Ответы API не кэшируются браузером ни при каких условиях.
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            # Заголовки безопасности из server{} наследуются только если в location
            # нет своих add_header; здесь есть, поэтому повторяем критичные.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # ─────────── Статика с хешем в имени: кэшируем навсегда ───────────
        # Vite кладёт бандлы в /assets/<name>-<hash>.<ext> — имя меняется вместе
        # с содержимым, поэтому immutable безопасен.
        location /assets/ {
            expires    1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files  $uri =404;
        }

        location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|eot)$ {
            expires    30d;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files  $uri =404;
        }

        # ─────────── Скрытые файлы: наружу не отдаём ───────────
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─────────── SPA fallback ───────────
        # Клиентский роутинг: любой неизвестный путь отдаёт index.html,
        # маршрут разбирает уже React Router.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html не кэшируем: иначе после деплоя пользователь месяцами
        # тянет старый бандл, ссылающийся на удалённые /assets/*.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            expires -1;
        }

        # ─────────── Ошибки ───────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            add_header Content-Type text/plain always;
            return 503 "Horizon UI is temporarily unavailable\n";
        }
    }
}
