# Security headers, kept in one file because nginx does NOT inherit `add_header` from an outer
# level into a location that declares any header of its own. Every location below that sets even a
# single `add_header` must therefore `include` this file, or it silently serves pages with no CSP
# and no X-Frame-Options — which is exactly what happened before this file existed.

add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    always;
add_header X-Content-Type-Options    "nosniff"                         always;
add_header X-Frame-Options           "DENY"                            always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none"   always;
