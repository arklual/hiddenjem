{{/*
=============================================================================
  ServiceAccount — отдельный на каждый сервис
=============================================================================
  Почему не общий `default`: ServiceAccount — это идентичность рабочей нагрузки.
  Общий аккаунт делает невозможным разграничение при появлении первого же
  сервиса, которому что-то понадобится (IRSA/Workload Identity для S3,
  доступ к внешнему хранилищу секретов).

  Токен не монтируется: ни один сервис Horizon не обращается к API Kubernetes,
  а лежащий в поде и никому не нужный токен — готовый материал для развития атаки.
  Ролей и RoleBinding здесь нет намеренно: прав у сервисов нет вообще.
=============================================================================
*/}}
{{- $root := . -}}
{{- range $name, $rawSvc := .Values.services }}
{{- if $rawSvc.enabled }}
{{- $svc := include "horizon.svc" (dict "root" $root "svc" $rawSvc) | fromYaml }}
{{- if $svc.serviceAccount.create }}
{{- $ctx := dict "root" $root "name" $name "svc" $svc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "horizon.serviceAccountName" $ctx }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "horizon.commonLabels" $ctx | nindent 4 }}
  {{- with $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $svc.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
