{{/*
=============================================================================
  ExternalSecret — заготовка интеграции с корпоративным хранилищем секретов
=============================================================================
  ГЛАВНОЕ: секретов в этом репозитории нет и не будет (NFR-S2). Ни в values,
  ни в ConfigMap, ни в зашифрованном виде. Источник истины — корпоративный
  vault банка; сюда приезжают только ССЫЛКИ на секреты.

  Как это работает:
    1. Администратор кладёт значения в vault по пути secrets.externalSecret.remotePath.
    2. External Secrets Operator (ESO) читает их и создаёт обычный Secret
       с именем secrets.name в namespace релиза.
    3. Deployment подключает его через envFrom.secretRef (см. deployment.yaml).

  ПОЧЕМУ ВЫКЛЮЧЕНО ПО УМОЛЧАНИЮ (secrets.externalSecret.enabled: false):
  ExternalSecret — это CRD. Если ESO в кластере не установлен, `helm install`
  падает на неизвестном ресурсе и не разворачивается вообще ничего. Включать
  надо осознанно, там, где оператор действительно есть.

  ЕСЛИ ESO НЕТ (первое развёртывание, тестовый кластер) — Secret создаётся
  вручную; ровно этот набор ключей ожидают сервисы:

      kubectl create secret generic horizon-secrets \
        --namespace <namespace> \
        --from-literal=SPRING_DATASOURCE_PASSWORD=... \
        --from-literal=HORIZON_DATABASE_PASSWORD=... \
        --from-literal=SPRING_DATA_REDIS_PASSWORD=... \
        --from-literal=HORIZON_CLICKHOUSE_USER=... \
        --from-literal=HORIZON_CLICKHOUSE_PASSWORD=... \
        --from-literal=HORIZON_GITHUB_TOKEN=...

  ЗАМЕЧАНИЕ ПО МОДЕЛИ ДОСТУПА. Сейчас все сервисы читают ОДИН Secret, то есть
  каждый видит пароли всех схем — это сводит на нет изоляцию, которую даёт
  ADR-0006. Правильная целевая схема — свой Secret на сервис
  (`horizon-secrets-<service>`) и свой путь в vault. Сделано так осознанно,
  чтобы не плодить сущности до появления реального vault; переход механический:
  параметризовать secrets.name именем сервиса.
  Зафиксировано как задача в бэклоге платформы.
=============================================================================
*/}}
{{- if .Values.secrets.externalSecret.enabled }}
{{- $root := . -}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "horizon.commonLabels" (dict "root" $root "name" "secrets") | nindent 4 }}
spec:
  {{- /* Секреты перечитываются раз в час: ротация пароля в vault доезжает
         до кластера без ручного вмешательства. Сам под при этом не
         перезапускается — за это отвечает reloader или ручной rollout. */}}
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: db_password
    - secretKey: HORIZON_DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: db_password
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: redis_password
    - secretKey: HORIZON_CLICKHOUSE_USER
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: clickhouse_user
    - secretKey: HORIZON_CLICKHOUSE_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: clickhouse_password
    - secretKey: HORIZON_GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remotePath }}
        property: github_token
{{- end }}
