{{/*
=============================================================================
  Ingress — единственная точка входа снаружи
=============================================================================
  Маршрутизация повторяет локальную схему (frontend + /api -> gateway),
  чтобы поведение приложения не зависело от среды: относительные пути в UI
  работают одинаково и на localhost:3000, и на https://<домен>.

  Порядок правил значим: `/api` объявлен ДО `/`, иначе префиксное правило
  корня перехватит и API-запросы.
=============================================================================
*/}}
{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- $fullname := include "horizon.fullname" . -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "horizon.commonLabels" (dict "root" $root "name" "ingress") | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  {{- /* NFR-S1: весь внешний трафик — TLS 1.2+. Версии и наборы шифров
         задаются в конфигурации контроллера, а не здесь: они общие
         для кластера и не должны разъезжаться по приложениям. */}}
  tls:
    - hosts:
        - {{ .Values.global.domain | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          {{- /* API. Объявлен первым — см. комментарий в шапке. */}}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-gateway" $fullname }}
                port:
                  number: {{ .Values.services.gateway.port }}
          {{- /* Всё остальное — статика UI. */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" $fullname }}
                port:
                  number: {{ .Values.services.frontend.port }}
{{- end }}
