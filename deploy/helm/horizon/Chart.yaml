apiVersion: v2
name: horizon
description: |
  Horizon — платформа обнаружения зарождающихся научно-технологических трендов.
  Зонтичный чарт: все шесть сервисов разворачиваются одним релизом из общего
  набора шаблонов, различия описаны данными в values.yaml, а не копиями манифестов.
type: application

# version    — версия ЧАРТА: меняется при правке шаблонов или values.
# appVersion — версия ПРИЛОЖЕНИЯ: тег образов по умолчанию (переопределяется CI).
# Их намеренно не синхронизируют: правка HPA не должна выглядеть как релиз кода.
version: 1.0.0
appVersion: "1.0.0"

# 1.27 — минимум, на котором доступны все используемые API:
#   autoscaling/v2, policy/v1 PodDisruptionBudget, seccompProfile в podSpec,
#   matchLabelKeys в topologySpreadConstraints (1.27, beta).
kubeVersion: ">=1.27.0-0"

keywords:
  - horizon
  - trends
  - microservices

home: https://github.com/horizon/horizon
sources:
  - https://github.com/horizon/horizon

maintainers:
  - name: Horizon Platform Team
    email: ops@horizon.example

annotations:
  # ADR, определяющие форму этого чарта.
  horizon.dev/adr: "0001,0005,0006,0007,0014"

# Зависимостей нет намеренно. PostgreSQL, Kafka, Redis и ClickHouse в
# промышленной среде разворачиваются операторами или берутся как управляемые
# сервисы: их жизненный цикл не совпадает с жизненным циклом приложения,
# и `helm uninstall` не должен иметь возможности снести базу данных.
dependencies: []
