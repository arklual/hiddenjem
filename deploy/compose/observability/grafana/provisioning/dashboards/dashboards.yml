# =============================================================================
#  Grafana — провижининг дашбордов из файлов (NFR-O2)
# =============================================================================
#  Дашборды лежат в репозитории и монтируются в контейнер read-only.
#  Правки через UI не сохранятся — это сделано намеренно: дашборд, изменённый
#  мышкой во время инцидента, исчезает вместе с контейнером, а вместе с ним
#  исчезает и знание, как этот инцидент смотрели.
#
#  Порядок работы: править JSON в репозитории -> `make up` (или перезапуск
#  grafana) -> изменения подхватятся за updateIntervalSeconds.
# =============================================================================
apiVersion: 1

providers:
  - name: horizon
    orgId: 1
    folder: Horizon
    folderUid: horizon
    type: file
    # true запретил бы удаление дашборда, убранного из репозитория,
    # и папка постепенно заросла бы мусором.
    disableDeletion: false
    updateIntervalSeconds: 30
    # false => UI-правки не сохраняются в файл (файлы всё равно read-only).
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      # Подпапки становятся подпапками в UI — задел на рост числа дашбордов.
      foldersFromFilesStructure: false
