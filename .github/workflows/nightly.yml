name: nightly

# Долгие проверки, которым не место в PR-цикле: они измеряют качество и деградацию,
# а не корректность конкретного изменения, и стоят десятки минут.
#
# Правило: nightly не блокирует разработку. Проваленная job создаёт issue,
# а не останавливает merge — иначе команда быстро научится её игнорировать.

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC — вне рабочего времени команды
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  mutation-java:
    name: Mutation testing (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: PIT — доменный слой
        # Порог 70% задан в pom. Покрытие само по себе ничего не гарантирует:
        # тест, который вызывает метод и ничего не проверяет, даёт 100% и ноль пользы.
        run: ./services/mvnw -f services/pom.xml -B test-compile org.pitest:pitest-maven:mutationCoverage -Pmutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-reports
          path: services/*/target/pit-reports
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  mutation-python:
    name: Mutation testing (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e 'services/analytics-service[dev]' mutmut

      - name: mutmut — формулы методологии
        working-directory: services/analytics-service
        run: |
          mutmut run --paths-to-mutate src/horizon_analytics/domain/scoring --no-progress || true
          mutmut results | tee mutmut-results.txt
          survived=$(mutmut results | grep -c '^ *[0-9]*: survived' || true)
          echo "Выжившие мутанты: $survived"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: services/analytics-service/mutmut-results.txt

  # ─────────────────────────────────────────────────────────────────────────────
  load:
    name: Нагрузочный тест (SLO)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Поднять стек
        run: |
          set -eu
          # --env-file обязателен и указывает на файл явно. Compose ищет `.env` в каталоге
          # compose-файла, а не там, откуда его запустили: `cp .env.example .env` в корне
          # репозитория он не видел вовсе, и стек поднимался на умолчаниях. Отсюда же и все
          # прочие правки развёртывания — их разбор в docs/01-analysis/82.
          cp .env.example .env
          # Сценарий держит 50 запросов в секунду — это и есть проверяемая нагрузка (NFR-P1), — а
          # приходят они с одного адреса, лимит же считается по адресу. Ограничитель отвергал
          # девять запросов из десяти, и мерилась его скорость отказа (медиана 2,7 мс), а не время
          # ответа продукта. Измеряется здесь сервис, а не защита от злоупотребления: на время
          # прогона потолок снят.
          {
            echo 'RATE_LIMIT_PER_MINUTE=20000'
            echo 'RATE_LIMIT_BURST=40000'
          } >> .env
          docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d --build
          # Ждём готовности шлюза, а не просто ответа: 200 на /health ещё не значит, что
          # зависимости за ним поднялись.
          timeout 900 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null; do sleep 5; done'

      - uses: grafana/setup-k6-action@v1

      - name: k6 — путь чтения
        # Пороги SLO закодированы в самом сценарии, поэтому регрессия латентности
        # роняет job, а не теряется в логах.
        run: k6 run tests/load/read-path.k6.js
        env:
          BASE_URL: http://localhost:8080
          # Уменьшен масштаб, а не требование. В двух ядрах раннера живёт весь стек — Postgres,
          # Redis, redpanda, ClickHouse, четыре JVM-сервиса, Prometheus, Grafana — и сам k6;
          # заявленные 50 запросов в секунду эта машина не отдаёт ни при какой правильности кода
          # (измерено: медиана чтения 2,8 с при минимуме 115 мс — очередь).
          #
          # А вот на десяти отдаёт с запасом: p95 чтения 154 мс при обещанных 300, методологии — 84
          # мс при 200. Поэтому пороги здесь не ослаблены и остаются теми же, что в НФТ: продукт им
          # соответствует, и послабление лишь спрятало бы настоящее ухудшение. Проверка SLO на
          # полной нагрузке — п. 23 бэклога, ей нужен стенд, а не раннер.
          LOAD_RATE: 10

      - name: Диагностика при неуспехе
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --tail=300

      - name: Погасить стек
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env down -v

  # ─────────────────────────────────────────────────────────────────────────────
  methodology-backtest:
    name: Бэктест методологии
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Задание больше не `continue-on-error`. Доля попаданий по-прежнему ничего не роняет —
    # ворота по ней превратили бы бэктест в украшение, которое подкручивают. Но артефакт,
    # поставляемый со сборкой, продукт показывает пользователю как заявление о достоверности:
    # устаревший артефакт — это неправильный ответ API, а не исследовательское наблюдение.
    # Различие проходит не по инструменту, а по потребителю.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e 'services/analytics-service[dev]'

      - name: Срез корпуса на 2021 год
        id: backtest
        run: |
          python -m horizon_analytics.tools.backtest --snapshot-year 2021 --output backtest.json | tee backtest.log

      # Порог по сырой доле попаданий был бы ровно той бессмысленной цифрой, против которой построен
      # сам инструмент: корпус растёт, и любое ранжирование даёт «попадания». Значение имеет только
      # преимущество над наивной альтернативой — читать самое публикуемое в направлении.
      - name: Аннотация с результатом
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys

          artifact = pathlib.Path("backtest.json")
          if not artifact.exists():
              print("::warning::Бэктест не дал результата — см. backtest.log")
              sys.exit(0)

          fresh = json.loads(artifact.read_text())
          hit, base = fresh["hitRate"], fresh["baselineHitRate"]
          advantage = fresh["advantage"]
          verdict = "notice" if advantage > 0 else "warning"
          print(f"::{verdict}::Бэктест: методология {hit:.0%} против базы {base:.0%} "
                f"(преимущество {advantage:+.0%})")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: |
            backtest.json
            backtest.log

  # ─────────────────────────────────────────────────────────────────────────────
  dependency-freshness:
    name: Актуальность зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Maven
        run: ./services/mvnw -f services/pom.xml -B versions:display-dependency-updates | tee maven-updates.txt

      - name: npm
        run: npm --prefix frontend outdated | tee npm-updates.txt || true

      - name: pip
        run: |
          pip install -e 'services/analytics-service[dev]'
          pip list --outdated | tee pip-updates.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-updates
          path: '*-updates.txt'

  # ─────────────────────────────────────────────────────────────────────────────
  report:
    name: Итог ночного прогона
    needs: [mutation-java, mutation-python, load, methodology-backtest, dependency-freshness]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Завести issue при неуспехе
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, value]) => value.result === 'failure')
              .map(([name]) => name);
            const title = `Ночной прогон: провалено ${failed.length} проверок`;
            const body = [
              `Прогон: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Провалены:',
              ...failed.map((name) => `* \`${name}\``),
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly'],
              });
            }
